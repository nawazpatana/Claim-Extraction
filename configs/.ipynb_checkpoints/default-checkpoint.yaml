paths:
  tei_dir: "./data/tei_xml"
  out_dir: "./out"
  cache_dir: "./out/cache"
  model_dir: "./out/model"
  predictions_path: "./out/predictions.jsonl"

spacy:
  model: "en_core_web_sm"

weak_supervision:
  min_sent_len: 20
  max_sents_per_paper: 30
  label_model:
    n_epochs: 200
    lr: 0.01
  threshold_pos: 0.65
  threshold_neg: 0.35

model:
  pretrained_name: "allenai/scibert_scivocab_uncased"
  max_length: 192
  train_epochs: 2
  batch_size: 16
  lr: 2e-5
  weight_decay: 0.01
  seed: 42
